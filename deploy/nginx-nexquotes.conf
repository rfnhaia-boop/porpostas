# /etc/nginx/sites-available/nex-quotes
# ln -s /etc/nginx/sites-available/nex-quotes /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx
# depois:  certbot --nginx -d quotes.newflowsys.cloud   (adiciona o bloco 443)

server {
    listen 80;
    server_name quotes.newflowsys.cloud;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
